<title>Chalkboard Showdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* Single-theme by design: a slate chalkboard on any host ground. */
  :root {
    color-scheme: dark;
    --slate: #22332e;
    --slate-deep: #1a2824;
    --frame: #6b4a2f;
    --chalk: #eef0e6;
    --chalk-dim: #a9b5ad;
    --yellow: #f2d57a;
    --pink: #f0a3b5;
    --blue: #9fd0e3;
    --display: "Gochi Hand", "Comic Sans MS", "Chalkboard SE", cursive;
    --body: "Atkinson Hyperlegible", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  html, body { height: 100%; }
  body {
    background: var(--slate-deep);
    color: var(--chalk);
    font: 16px/1.5 var(--body);
    padding-inline: 16px;
    padding-block: 20px;
    box-sizing: border-box;
  }
  .board {
    max-width: 760px;
    margin: 0 auto;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.05), transparent 60%),
      radial-gradient(ellipse at 80% 90%, rgba(255,255,255,.035), transparent 55%),
      var(--slate);
    border: 12px solid var(--frame);
    border-radius: 6px;
    box-shadow: inset 0 0 40px rgba(0,0,0,.45), 0 10px 30px rgba(0,0,0,.4);
    padding: clamp(16px, 4vw, 32px);
    display: grid;
    gap: 22px;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px 16px; }
  h1 {
    font: 400 clamp(2rem, 6vw, 2.8rem)/1 var(--display);
    margin: 0;
    text-wrap: balance;
    transform: rotate(-1.5deg);
  }
  h1 span { color: var(--yellow); }
  .mode { display: flex; gap: 6px; align-items: center; font-size: .85rem; color: var(--chalk-dim); }
  .mode button {
    font: 500 .8rem var(--mono);
    background: none; color: var(--chalk-dim);
    border: 1.5px dashed var(--chalk-dim); border-radius: 4px;
    padding: 4px 9px; cursor: pointer;
  }
  .mode button[aria-pressed="true"] { color: var(--slate); background: var(--chalk); border-style: solid; border-color: var(--chalk); }

  /* Scoreboard with tally marks */
  .score {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
    border-block: 2px dashed rgba(238,240,230,.25);
    padding-block: 14px;
  }
  .side { display: grid; gap: 4px; }
  .side.cpu { text-align: right; justify-items: end; }
  .who { font: 400 1.45rem/1 var(--display); }
  .you .who { color: var(--blue); }
  .cpu .who { color: var(--pink); }
  .tally { min-height: 30px; display: flex; flex-wrap: wrap; gap: 8px; }
  .tally svg { width: 34px; height: 30px; }
  .tally line { stroke: var(--chalk); stroke-width: 2.6; stroke-linecap: round; }
  .num { font: 500 .8rem var(--mono); color: var(--chalk-dim); font-variant-numeric: tabular-nums; }
  .draws { text-align: center; font: 500 .8rem var(--mono); color: var(--chalk-dim); }
  .draws b { display: block; font: 400 1.6rem/1 var(--display); color: var(--chalk); }

  /* Arena */
  .arena { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; min-height: 170px; }
  .hand {
    font-size: clamp(4rem, 16vw, 6.5rem); line-height: 1; text-align: center;
    filter: grayscale(.25) drop-shadow(0 0 1px rgba(255,255,255,.4));
  }
  .hand.you { transform: scaleX(-1) rotate(90deg); }
  .hand.cpu { transform: rotate(-90deg); }
  .hand.win { filter: drop-shadow(0 0 14px var(--yellow)); }
  .hand.lose { opacity: .45; }
  .shaking.you { animation: shakeY .28s ease-in-out 3; }
  .shaking.cpu { animation: shakeC .28s ease-in-out 3; }
  @keyframes shakeY { 50% { transform: scaleX(-1) rotate(90deg) translateX(-22px); } }
  @keyframes shakeC { 50% { transform: rotate(-90deg) translateX(-22px); } }
  .vs { font: 400 1.4rem var(--display); color: var(--chalk-dim); }
  .verdict {
    text-align: center; min-height: 2.6em;
    font: 400 clamp(1.5rem, 5vw, 2.1rem)/1.2 var(--display);
    text-wrap: balance;
  }
  .verdict.win { color: var(--yellow); }
  .verdict.lose { color: var(--pink); }
  .verdict small { display: block; font: 400 .95rem var(--body); color: var(--chalk-dim); margin-top: 4px; }

  /* Choices */
  .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .choice {
    display: grid; justify-items: center; gap: 4px;
    background: rgba(238,240,230,.04);
    color: var(--chalk);
    border: 2.5px solid var(--chalk);
    border-radius: 14px 18px 12px 20px / 18px 12px 20px 14px;
    padding: 14px 6px 10px;
    cursor: pointer;
    font: 400 1.35rem/1 var(--display);
    transition: transform .12s, background .12s, border-color .12s;
  }
  .choice .glyph { font-size: 2.4rem; line-height: 1; }
  .choice kbd { font: 500 .7rem var(--mono); color: var(--chalk-dim); border: 1px solid rgba(238,240,230,.3); border-radius: 3px; padding: 1px 5px; }
  .choice:hover:not(:disabled) { transform: translateY(-3px) rotate(-1deg); background: rgba(238,240,230,.09); border-color: var(--yellow); }
  .choice:focus-visible, .mode button:focus-visible, .link:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
  .choice:disabled { opacity: .5; cursor: default; }

  footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 16px; font-size: .88rem; color: var(--chalk-dim); }
  .history { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .pip { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--chalk-dim); box-sizing: border-box; }
  .pip.w { background: var(--yellow); border-color: var(--yellow); }
  .pip.l { background: var(--pink); border-color: var(--pink); }
  .link { background: none; border: none; color: var(--chalk); font: inherit; text-decoration: underline dashed; text-underline-offset: 4px; cursor: pointer; padding: 0; }
  .note { font-size: .82rem; color: var(--chalk-dim); max-width: 60ch; margin: 0; }

  @media (max-width: 420px) {
    .choice { font-size: 1.1rem; }
    .choice .glyph { font-size: 2rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .shaking.you, .shaking.cpu { animation: none; }
    .choice { transition: none; }
  }
</style>

<main class="board">
  <header>
    <h1>Rock, Paper, <span>Scissors!</span></h1>
    <div class="mode" role="group" aria-label="Match length">
      First to
      <button type="button" data-target="3" aria-pressed="true">3</button>
      <button type="button" data-target="5" aria-pressed="false">5</button>
      <button type="button" data-target="0" aria-pressed="false">∞</button>
    </div>
  </header>

  <section class="score" aria-label="Score">
    <div class="side you"><span class="who">You</span><div class="tally" id="tallyYou"></div><span class="num" id="numYou">0 wins</span></div>
    <div class="draws">draws<b id="numDraw">0</b></div>
    <div class="side cpu"><span class="who">Chalky</span><div class="tally" id="tallyCpu"></div><span class="num" id="numCpu">0 wins</span></div>
  </section>

  <section class="arena" aria-live="polite">
    <div class="hand you" id="handYou" aria-label="Your hand">✊</div>
    <div class="vs">vs</div>
    <div class="hand cpu" id="handCpu" aria-label="Chalky's hand">✊</div>
  </section>

  <div class="verdict" id="verdict" aria-live="polite">Pick a hand to throw.<small>Press R, P or S — or tap below.</small></div>

  <section class="choices" aria-label="Your move">
    <button type="button" class="choice" id="btnRock" data-move="rock"><span class="glyph" aria-hidden="true">✊</span>Rock<kbd>R</kbd></button>
    <button type="button" class="choice" id="btnPaper" data-move="paper"><span class="glyph" aria-hidden="true">✋</span>Paper<kbd>P</kbd></button>
    <button type="button" class="choice" id="btnScissors" data-move="scissors"><span class="glyph" aria-hidden="true">✌️</span>Scissors<kbd>S</kbd></button>
  </section>

  <footer>
    <div class="history" id="history" aria-label="Recent rounds"></div>
    <button type="button" class="link" id="reset">Wipe the board</button>
  </footer>
  <p class="note">Chalky watches what you tend to throw after each move and tries to counter it — mix things up to stay ahead.</p>
</main>

<script>
(() => {
  const GLYPH = { rock: "✊", paper: "✋", scissors: "✌️" };
  const BEATS = { rock: "scissors", paper: "rock", scissors: "paper" };
  const COUNTER = { rock: "paper", paper: "scissors", scissors: "rock" };
  const VERB = { rock: "crushes", paper: "covers", scissors: "cut" };
  const MOVES = ["rock", "paper", "scissors"];
  const cap = s => s[0].toUpperCase() + s.slice(1);
  const $ = id => document.getElementById(id);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let state = { you: 0, cpu: 0, draw: 0, target: 3, last: null, trans: {}, freq: { rock: 0, paper: 0, scissors: 0 }, history: [] };
  try { const t = +localStorage.getItem("rps-target"); if ([0, 3, 5].includes(t)) state.target = t; } catch (e) {}
  let busy = false;

  function cpuMove() {
    // Predict the player's next move from what they threw after their last move; counter it 70% of the time.
    const table = state.last ? state.trans[state.last] : null;
    const src = table && Object.values(table).some(Boolean) ? table : state.freq;
    const total = MOVES.reduce((n, m) => n + (src[m] || 0), 0);
    if (total === 0 || Math.random() < 0.3) return MOVES[Math.floor(Math.random() * 3)];
    const guess = MOVES.reduce((a, b) => ((src[b] || 0) > (src[a] || 0) ? b : a));
    return COUNTER[guess];
  }

  function learn(move) {
    state.freq[move]++;
    if (state.last) {
      state.trans[state.last] ??= { rock: 0, paper: 0, scissors: 0 };
      state.trans[state.last][move]++;
    }
    state.last = move;
  }

  function tallySVG(n) {
    const groups = [];
    for (let i = 0; i < n; i += 5) {
      const k = Math.min(5, n - i);
      let lines = "";
      for (let j = 0; j < Math.min(k, 4); j++) {
        const x = 5 + j * 7, wob = (j % 2 ? 1 : -1);
        lines += `<line x1="${x}" y1="${4 + wob}" x2="${x + wob}" y2="26"/>`;
      }
      if (k === 5) lines += `<line x1="1" y1="22" x2="31" y2="7"/>`;
      groups.push(`<svg viewBox="0 0 34 30" aria-hidden="true">${lines}</svg>`);
    }
    return groups.join("");
  }

  function render() {
    $("tallyYou").innerHTML = tallySVG(state.you);
    $("tallyCpu").innerHTML = tallySVG(state.cpu);
    $("numYou").textContent = `${state.you} win${state.you === 1 ? "" : "s"}`;
    $("numCpu").textContent = `${state.cpu} win${state.cpu === 1 ? "" : "s"}`;
    $("numDraw").textContent = state.draw;
    $("history").innerHTML = state.history.slice(-12).map(r =>
      `<span class="pip ${r}" title="${r === "w" ? "Win" : r === "l" ? "Loss" : "Draw"}"></span>`).join("") ||
      `<span>No rounds yet</span>`;
    document.querySelectorAll(".mode button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.target === state.target)));
  }

  function setVerdict(cls, main, sub) {
    const v = $("verdict");
    v.className = "verdict " + cls;
    v.innerHTML = `${main}<small>${sub}</small>`;
  }

  function matchOver() {
    return state.target && (state.you >= state.target || state.cpu >= state.target);
  }

  function play(move) {
    if (busy) return;
    if (matchOver()) newMatch(false);
    busy = true;
    const cpu = cpuMove();
    learn(move);
    const hy = $("handYou"), hc = $("handCpu");
    hy.textContent = hc.textContent = GLYPH.rock;
    hy.className = "hand you"; hc.className = "hand cpu";
    document.querySelectorAll(".choice").forEach(b => b.disabled = true);

    const words = ["Rock…", "Paper…", "Scissors…"];
    let i = 0;
    const step = () => {
      if (i < words.length) {
        setVerdict("", words[i++], "&nbsp;");
        setTimeout(step, reduced ? 120 : 280);
      } else reveal(move, cpu);
    };
    if (!reduced) { void hy.offsetWidth; hy.classList.add("shaking"); hc.classList.add("shaking"); }
    step();
  }

  function reveal(move, cpu) {
    const hy = $("handYou"), hc = $("handCpu");
    hy.classList.remove("shaking"); hc.classList.remove("shaking");
    hy.textContent = GLYPH[move]; hc.textContent = GLYPH[cpu];
    hy.setAttribute("aria-label", "Your hand: " + move);
    hc.setAttribute("aria-label", "Chalky's hand: " + cpu);

    let result;
    if (move === cpu) {
      state.draw++; result = "d";
      setVerdict("", "Shoot! It's a draw.", `You both threw ${move}.`);
    } else if (BEATS[move] === cpu) {
      state.you++; result = "w";
      hy.classList.add("win"); hc.classList.add("lose");
      setVerdict("win", "Shoot! You win the round.", `${cap(move)} ${VERB[move]} ${cpu}.`);
    } else {
      state.cpu++; result = "l";
      hc.classList.add("win"); hy.classList.add("lose");
      setVerdict("lose", "Shoot! Chalky takes it.", `${cap(cpu)} ${VERB[cpu]} ${move}.`);
    }
    state.history.push(result);

    if (matchOver()) {
      const youWon = state.you > state.cpu;
      setVerdict(youWon ? "win" : "lose",
        youWon ? `You win the match, ${state.you}–${state.cpu}!` : `Chalky wins the match, ${state.cpu}–${state.you}.`,
        "Throw again to start a new match.");
    }
    render();
    document.querySelectorAll(".choice").forEach(b => b.disabled = false);
    busy = false;
  }

  function newMatch(full) {
    state.you = state.cpu = state.draw = 0;
    state.history = [];
    if (full) { state.last = null; state.trans = {}; state.freq = { rock: 0, paper: 0, scissors: 0 }; }
    $("handYou").className = "hand you"; $("handCpu").className = "hand cpu";
    $("handYou").textContent = $("handCpu").textContent = GLYPH.rock;
    render();
  }

  document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => play(b.dataset.move)));
  document.querySelectorAll(".mode button").forEach(b => b.addEventListener("click", () => {
    state.target = +b.dataset.target;
    try { localStorage.setItem("rps-target", String(state.target)); } catch (e) {}
    newMatch(false);
    setVerdict("", state.target ? `New match: first to ${state.target}.` : "Endless mode.", "Press R, P or S — or tap below.");
  }));
  $("reset").addEventListener("click", () => {
    newMatch(true);
    setVerdict("", "Board wiped clean.", "Chalky forgot everything it learned about you.");
  });
  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const m = { r: "rock", p: "paper", s: "scissors" }[e.key.toLowerCase()];
    if (m) play(m);
  });

  render();
})();
</script>
